version: 1
env:
  runtime-versions:
    nodejs: 20
backend:
  phases:
    preBuild:
      commands:
        # Install root dependencies (for any build tooling)
        - npm ci --cache .npm --prefer-offline
        # Install dependencies for each Lambda function that has its own package.json
        - |
          find amplify/functions -maxdepth 2 -type f -name package.json \
            -exec bash -lc 'echo "Installing deps in $(dirname {})"; cd "$(dirname {})" && npm ci --omit=dev' \;
    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*